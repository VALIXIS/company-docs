<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valixis Games Hub</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #111;
      --card: #222;
      --accent: #ff6a00;
      --text: #eee;
    }

    body {
      margin: 0;
      padding: 2rem;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    h1 {
      color: var(--accent);
    }

    .game-list {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .game {
      width: 260px;
      padding: 1rem;
      background: var(--card);
      border-radius: 8px;
      text-align: center;
    }

    .game a {
      color: var(--accent);
      font-weight: bold;
      text-decoration: none;
    }

    .game a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Valixis Games</h1>
  <p>Select a game to play:</p>
  <div class="game-list">
    <div class="game">
      <h2>Soul Ember: Survivors</h2>
      <a href="soul-ember/index.html">Play</a>
    </div>
  </div>
</body>
</html>
