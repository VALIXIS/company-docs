<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378"/>
      <stop offset="50%" stop-color="#C29B38"/>
      <stop offset="100%" stop-color="#997722"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2C231C"/>
      <stop offset="100%" stop-color="#18130F"/>
    </radialGradient>
  </defs>
  <!-- Background circular seal -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/>
  
  <!-- Laurel wreath left -->
  <path d="M 68 140 C 50 115 50 85 70 60 C 68 70 70 82 76 92 C 70 102 68 120 72 135 Z" fill="url(#goldGrad)" opacity="0.6"/>
  <!-- Laurel wreath right -->
  <path d="M 132 140 C 150 115 150 85 130 60 C 132 70 130 82 124 92 C 130 102 132 120 128 135 Z" fill="url(#goldGrad)" opacity="0.6"/>
  
  <!-- Architectural Arch Crown -->
  <path d="M 80 50 Q 100 35 120 50" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="100" cy="42" r="3" fill="url(#goldGrad)"/>

  <!-- Monogram LV -->
  <!-- Letter L -->
  <text x="82" y="118" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">L</text>
  <!-- Letter V interlocked -->
  <text x="114" y="122" font-family="'Playfair Display', Georgia, serif" font-size="54" font-weight="700" fill="#FDFBF7" text-anchor="middle" letter-spacing="-2">V</text>
  
  <!-- Star and Est -->
  <text x="100" y="148" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">CAFÉ BAR</text>
  <text x="100" y="162" font-family="'Space Grotesk', sans-serif" font-size="7.5" fill="#A89F91" text-anchor="middle" letter-spacing="2">JUBILEE HILLS</text>
</svg>
